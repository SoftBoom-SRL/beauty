# Lint del backend: `ruff check .` dalla cartella backend/.
#
# Solo regole che trovano errori: import e variabili inutilizzati, nomi non
# definiti, trappole note di Python (bugbear) e di Django. Il formato resta
# quello del codice esistente: `ruff format` qui non si usa.
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[lint]
select = ["E", "W", "F", "B", "DJ"]
ignore = [
    "E501",  # righe lunghe: il codice va a capo dove si legge meglio
    "B008",  # File(...) / Query(...) come valori di default: è l'idioma di django-ninja
    "B904",  # raise HttpError dentro un except: la catena delle eccezioni non arriva mai al client
    "B905",  # zip(strict=...): aggiungerlo dove manca cambierebbe il comportamento
    "DJ012", # ordine dei membri nei modelli: stile, non errori
]
