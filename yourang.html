<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>yourang — gestionale beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  @keyframes subSlide { from { transform: translateX(28px); } to { transform: translateX(0); } }
  #root { min-height: 100vh; }
  /* instant loading splash — shown before React mounts, auto-replaced on mount */
  .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #E7E0D7; font-family: "Hanken Grotesk", -apple-system, sans-serif; }
  .boot__wm { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 26px; letter-spacing: -0.025em; color: #211C18; }
  .boot__wm i { width: 8px; height: 8px; border-radius: 50%; background: #C2603F; display: inline-block; }
  .boot__ring { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(33,28,24,0.14); border-top-color: #C2603F; animation: bootspin 0.8s linear infinite; }
  .boot__txt { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #756B5F; }
  @keyframes bootspin { to { transform: rotate(360deg); } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"><div class="boot"><div class="boot__wm">yourang<i></i></div><div class="boot__ring"></div><div class="boot__txt">Caricamento…</div></div></div>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="screen-cliente.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script>
  /* plain JS (not Babel): if React hasn't taken over #root after 14s,
     the scripts likely failed to download \u2014 tell the user instead of spinning forever. */
  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && root.querySelector('.boot')) {
      var txt = root.querySelector('.boot__txt');
      var ring = root.querySelector('.boot__ring');
      if (ring) ring.style.display = 'none';
      if (txt) { txt.innerHTML = 'Sto impiegando pi\u00f9 del previsto. Controlla la connessione e <a href="" style="color:#9A4A2E;font-weight:700;">ricarica la pagina</a>.'; txt.style.maxWidth = '280px'; txt.style.textAlign = 'center'; txt.style.lineHeight = '1.5'; }
    }
  }, 14000);
</script>
</body>
</html>
