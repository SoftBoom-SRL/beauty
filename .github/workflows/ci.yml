# Controlli automatici: lint, test e build di backend e frontend, dal workflow condiviso
# SoftBoom-SRL/.github (checks.yml).
#
# Girano sulle pull request e sui push su main. Il deploy (Coolify) parte dal
# push su main indipendentemente da qui: questa è la rete che dice se il codice
# arrivato su main è sano, non un cancello davanti al deploy.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    uses: SoftBoom-SRL/.github/.github/workflows/checks.yml@main
    with:
      working-directory: backend
      python: "3.12"   # come backend/Dockerfile
      # Nessuna variabile d'ambiente: con DEBUG di serie acceso bastano SQLite e le
      # chiavi di sviluppo; Stripe e Yourang nei test sono finti. Non impostare
      # DEBUG=0 qui: il controllo di produzione pretende segreti veri.
      run: |
        pip install -r requirements.txt -r requirements-dev.txt
        ruff check .
        python manage.py check
        python manage.py makemigrations --check --dry-run
        python manage.py test --noinput --parallel auto

  frontend:
    uses: SoftBoom-SRL/.github/.github/workflows/checks.yml@main
    with:
      working-directory: frontend
      node: "22"   # come frontend/Dockerfile
      run: |
        npm run lint
        npm test
        npm run build
