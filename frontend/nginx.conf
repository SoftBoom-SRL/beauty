server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Il proxy di Coolify (Traefik) termina TLS e passa gli header reali
  real_ip_header X-Forwarded-For;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  # `text/javascript` non è un doppione: da nginx 1.25.1 è QUEL tipo che mime.types
  # assegna ai .js (prima era application/javascript). Senza, l'intero bundle
  # dell'applicazione — il file più pesante della pagina — viaggiava non compresso
  # a ogni deploy, perché ogni deploy cambia l'hash nel nome e invalida la cache.
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Intestazioni di sicurezza delle due SPA: sul gestionale si digita la password
  # dello staff, e finora l'HSTS c'era solo sull'API. Niente iframe altrui (un
  # sito terzo non può incorniciare la pagina di accesso per rubare i clic), niente
  # indovinare il tipo dei file. L'HSTS è ignorato dai browser sulle risposte in
  # chiaro, quindi non disturba chi prova l'immagine in locale su http://.
  # ATTENZIONE: nginx eredita gli `add_header` del server SOLO nelle location che
  # non ne dichiarano di propri — per questo le stesse righe sono ripetute sotto.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Gli asset hanno l'hash nel nome: cache lunga e immutabile
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # index.html mai in cache: dopo un deploy il browser deve vedere i nuovi hash,
  # altrimenti richiede chunk che non esistono più e la SPA resta bianca.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # SPA fallback. Indispensabile per la dashboard: main.jsx fa routing su
  # window.location.pathname per /oauth-popup/start e /oauth-popup/done.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
